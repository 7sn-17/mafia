plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dev7sn.mafia'
    compileSdk 34

    defaultConfig {
        // اسم الحزمة الجديد كلياً ليصبح تطبيقاً فريداً ومستقلاً
        applicationId "com.dev7sn.mafia"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "Mafia.apk"
        }
    }
}
