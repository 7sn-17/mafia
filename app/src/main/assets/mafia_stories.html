function bindBundleEvents(el){
    const backBtn=el.querySelector('#bundleBackBtn');
   // 🗂️ منطق التبديل بين التبويبات
const tabs=el.querySelectorAll('.bundle-tab');
const panels=el.querySelectorAll('.bundle-panel');

tabs.forEach(tab=>{
    tab.addEventListener('click',()=>{
        sfc();
        const target=tab.dataset.tab;
        tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===target));
        panels.forEach(p=>p.classList.toggle('active',p.dataset.panel===target));
        // إذا انتقلنا لتبويب الكود، ركّز على الحقل
        if(target==='code'){
            setTimeout(()=>{
                const inp=el.querySelector('#bundleCodeInput');
                if(inp)inp.focus();
            },300);
        }
    });
});
 const copyBtn=el.querySelector('#bundleCopyBtn');
    const codeInput=el.querySelector('#bundleCodeInput');
    const clearBtn=el.querySelector('#bundleClearBtn');
    const submitBtn=el.querySelector('#bundleSubmitBtn');
    const statusEl=el.querySelector('#bundleStatus');

    backBtn.addEventListener('click',()=>{
        sfc();renderHome();showScreen('home');
    });

    copyBtn.addEventListener('click',()=>{
        sfc();
        navigator.clipboard.writeText('+963984623461').then(()=>{
            const orig=copyBtn.innerHTML;
            copyBtn.innerHTML='<i class="fa-solid fa-check"></i><span>تم النسخ!</span>';
            setTimeout(()=>{copyBtn.innerHTML=orig},1500);
        }).catch(()=>toast('تعذّر النسخ','انسخ يدوياً: +963 984 623 461','warn'));
    });

    clearBtn.addEventListener('click',()=>{
        codeInput.value='';
        codeInput.focus();
        codeInput.classList.remove('error','success');
        statusEl.className='bundle-code-status';
        statusEl.innerHTML='';
    });

    codeInput.addEventListener('input',(e)=>{
        e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
        codeInput.classList.remove('error');
        statusEl.className='bundle-code-status';
        statusEl.innerHTML='';
    });

    codeInput.addEventListener('keypress',(e)=>{
        if(e.key==='Enter'&&!submitBtn.disabled)doBundleSubmit();
    });

    const showStatus=(msg,type)=>{
        statusEl.className='bundle-code-status '+type;
        const icons={loading:'fa-spinner fa-spin',error:'fa-circle-xmark',success:'fa-circle-check'};
        statusEl.innerHTML=`<i class="fa-solid ${icons[type]||'fa-circle-info'}"></i><span>${msg}</span>`;
    };

    const doBundleSubmit=async()=>{
        const code=codeInput.value.trim();
        const btnText=submitBtn.querySelector('span');

        if(!code){
            showStatus('الرجاء إدخال الكود','error');
            codeInput.classList.add('error');codeInput.focus();return;
        }
        if(!/^MAFIA-(B|S|ALL)-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)){
            showStatus('صيغة الكود غير صحيحة','error');
            codeInput.classList.add('error');codeInput.focus();return;
        }

        submitBtn.disabled=true;
        submitBtn.style.opacity='.6';
        btnText.textContent='جاري التحقق...';
        submitBtn.querySelector('i').className='fa-solid fa-spinner fa-spin';
        showStatus('جاري التحقق من الكود...','loading');

        try{
            const result=await verifyCodeWithServer(code);
            if(result.success){
                sfe();
                codeInput.classList.add('success');
                showStatus('✅ '+(result.message||'تم التفعيل بنجاح'),'success');
                setTimeout(()=>{
                    toast('🎉 تم التفعيل!','القصتان متاحتان الآن','success','fa-unlock');
                    setTimeout(()=>{
                        S.storyId=null;
                        renderHome();
                        showScreen('home');
                    },600);
                },800);
            }else{
                sfdng();
                codeInput.classList.add('error');
                showStatus('❌ '+(result.error||'فشل التحقق'),'error');
                submitBtn.disabled=false;
                submitBtn.style.opacity='1';
                btnText.textContent='تفعيل العرض';
                submitBtn.querySelector('i').className='fa-solid fa-unlock';
            }
        }catch(err){
            sfdng();
            codeInput.classList.add('error');
            showStatus('⚠️ '+(err.message||'فشل الاتصال'),'error');
            submitBtn.disabled=false;
            submitBtn.style.opacity='1';
            btnText.textContent='تفعيل العرض';
            submitBtn.querySelector('i').className='fa-solid fa-unlock';
        }
    };

    submitBtn.addEventListener('click',doBundleSubmit);
}

function init(){
    createDust();
    renderHome();
    showScreen('home');
    
    // ⚡ فحص فوري عند كل فتح (خلفي — لا يعطل المستخدم)
    setTimeout(() => {
        quickCheckOnLaunch().catch(err => {
            console.log('[License] Quick check error:', err.message);
        });
    }, 800);
    
    // 🔄 المزامنة الدورية (كل 4 أيام)
    setTimeout(() => {
        syncLicenseIfNeeded().catch(err => {
            console.log('[License] Background sync error:', err.message);
        });
    }, 2500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();

})();
