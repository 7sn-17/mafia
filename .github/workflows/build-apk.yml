name: Build Mafia APK Final

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Complete Build Process
      run: |
        # إنشاء مشروع كاباسيتور والعمل داخله مباشرة
        mkdir mafia-app
        cd mafia-app
        
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        # إنشاء ملف الإعدادات
        echo '{"appId": "com.mafia.game", "appName": "مافيا", "webDir": "www", "plugins": {"SplashScreen": {"launchShowDuration": 1500, "backgroundColor": "#050d0a", "showSpinner": false}}}' > capacitor.config.json
        
        mkdir www
        cp ../index.html www/
        
        npx cap add android
        npx cap sync android
        
        # حقن الأيقونة باحترافية كاملة لجميع المقاسات
        ICON_SRC=""
        if [ -f ../icon.png ]; then
          ICON_SRC="../icon.png"
        elif [ -f ../assets/icon.png ]; then
          ICON_SRC="../assets/icon.png"
        fi
        
        if [ -n "$ICON_SRC" ]; then
          RES_DIR="android/app/src/main/res"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$d"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher.png"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_round.png"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_foreground.png"
          done
        fi
        
        # الانتقال لمدير التطبيق الأندرويد وإنشاء مفتاح التوقيع الثابت وبناء الـ APK مباشرة بدون تشتت في المسارات
        cd android/app
        keytool -genkey -v -keystore mafia-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mafia-alias -storepass mafia123 -keypass mafia123 -dname "CN=Hasan, O=Mafia, C=SY"
        
        # إضافة إعدادات التوقيع لملف الـ build.gradle بضمان تام
        echo "" >> build.gradle
        echo "android {" >> build.gradle
        echo "    signingConfigs {" >> build.gradle
        echo "        release {" >> build.gradle
        echo "            storeFile file('mafia-release-key.jks')" >> build.gradle
        echo "            storePassword 'mafia123'" >> build.gradle
        echo "            keyAlias 'mafia-alias'" >> build.gradle
        echo "            keyPassword 'mafia123'" >> build.gradle
        echo "        }" >> build.gradle
        echo "    }" >> build.gradle
        echo "    buildTypes {" >> build.gradle
        echo "        release {" >> build.gradle
        echo "            signingConfig signingConfigs.release" >> build.gradle
        echo "        }" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle
        
        # العودة لمجلد المشروع الأساسي لتشغيل الـ Gradle وتجنب أخطاء المسارات
        cd ../..
        ./mafia-app/android/gradlew -p mafia-app/android assembleDebug --no-daemon

    - name: Find and Export APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-final-apk
        path: mafia.apk
