name: Build Mafia APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create App and Build APK
      run: |
        cordova create my-app com.mafia.game "مافيا"
        cd my-app
        
        # نسخ ملف اللعبة إلى مجلد www
        cp -r ../index.html www/
        
        # نسخ الأيقونة إلى مجلد الجذور للمشروع لكي يعتمدها كوردوفا
        if [ -f ../icon.png ]; then
          cp ../icon.png icon.png
        fi
        
        # تعديل ملف config.xml لإضافة الأيقونة رسمياً لتطبيق الأندرويد
        # سنقوم بإدراج السطر الخاص بالأيقونة قبل وسم إغلاق الـ widget
        sed -i 's|</widget>|<icon src="icon.png"/></widget>|g' config.xml
        
        cordova platform add android
        
        # بناء التطبيق بصيغة ديباك
        cordova build android --debug

    - name: Find and Rename APK
      run: |
        # البحث عن ملف الـ APK الناتج ونسخه باسم mafia.apk
        find my-app/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia
        path: mafia.apk
