name: Build Mafia APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create App and Build APK
      run: |
        cordova create my-app com.mafia.game "مافيا"
        cd my-app
        
        # نسخ ملفات اللعبة
        cp -r ../index.html www/
        
        # نسخ الأيقونة الأصلية ذات الجودة العالية إلى مجلد الجذور
        if [ -f ../icon.png ]; then
          cp ../icon.png icon.png
        fi
        
        # إضافة الأيقونة في ملف config.xml وإلغاء تفعيل شاشة البداية الافتراضية (Splash Screen) نهائياً
        cat << 'EOF' > update_config.js
        const fs = require('fs');
        let config = fs.readFileSync('config.xml', 'utf8');
        
        // إضافة الأيقونة
        config = config.replace('</widget>', '<icon src="icon.png" /></widget>');
        
        // تعطيل شاشة البداية وتصفير أوقاتها لكي تختفي تماماً ولا تظهر الشاشة الرمادية
        config = config.replace('</widget>', '<preference name="SplashScreen" value="none" /><preference name="AutoHideSplashScreen" value="true" /></widget>');
        
        fs.writeFileSync('config.xml', config, 'utf8');
        EOF
        
        node update_config.js
        
        cordova platform add android
        
        # بناء التطبيق بصيغة ديباك
        cordova build android --debug

    - name: Find and Rename APK
      run: |
        find my-app/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia
        path: mafia.apk
