name: Build Mafia APK Final Fullscreen

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Complete Build Process
      run: |
        # حفظ المسار الجذري للمشروع
        ROOT_DIR=$(pwd)
        
        # إنشاء مشروع كاباسيتور
        mkdir mafia-app
        cd mafia-app
        
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        # إعدادات كاباسيتور الأساسية
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.mafia.game",
          "appName": "مافيا",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 1500,
              "backgroundColor": "#050d0a",
              "showSpinner": false
            }
          }
        }
        EOF
        
        mkdir www
        cp "$ROOT_DIR/index.html" www/
        
        npx cap add android
        npx cap sync android
        
        # تفعيل وضع ملء الشاشة الفلكي وإخفاء الأشرطة العلوية والسفلية عبر ملف الثيمات
        THEME_FILE="android/app/src/main/res/values/styles.xml"
        if [ -f "$THEME_FILE" ]; then
          # إزالة الوسم الختامي المؤقت وإضافة خصائص ملء الشاشة ثم إرجاع الوسم
          sed -i 's|<!-- Customize your theme here. -->|<!-- Customize your theme here. -->\n        <item name=\"android:windowFullscreen\">true</item>\n        <item name=\"android:windowContentOverlay\">@null</item>|g' "$THEME_FILE"
        fi
        
        # حقن الأيقونة باحترافية لجميع المقاسات
        ICON_SRC=""
        if [ -f "$ROOT_DIR/icon.png" ]; then
          ICON_SRC="$ROOT_DIR/icon.png"
        elif [ -f "$ROOT_DIR/assets/icon.png" ]; then
          ICON_SRC="$ROOT_DIR/assets/icon.png"
        fi
        
        if [ -n "$ICON_SRC" ]; then
          RES_DIR="android/app/src/main/res"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$d"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher.png"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_round.png"
            cp "$ICON_SRC" "$RES_DIR/mipmap-$d/ic_launcher_foreground.png"
          done
        fi
        
        # الانتقال المباشر لمجلد أندرويد لإنشاء المفتاح والتوقيع والتنفيذ الآمن
        cd android
        
        # منح صلاحيات التنفيذ لملف الـ gradlew لضمان عدم فشل العملية نهائياً
        chmod +x gradlew
        
        # توليد المفتاح وتعديل ملف build.gradle في مكانه الصحيح
        cd app
        keytool -genkey -v -keystore mafia-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mafia-alias -storepass mafia123 -keypass mafia123 -dname "CN=Hasan, O=Mafia, C=SY"
        
        cat << 'EOF' >> build.gradle

android {
    signingConfigs {
        release {
            storeFile file('mafia-release-key.jks')
            storePassword 'mafia123'
            keyAlias 'mafia-alias'
            keyPassword 'mafia123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
EOF

        # العودة مجدداً لمجلد أندرويد الرئيسي لتشغيل البناء بكل سلاسة
        cd ..
        ./gradlew assembleDebug --no-daemon

    - name: Find and Export APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-final-fullscreen-apk
        path: mafia.apk
