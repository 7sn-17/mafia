name: Build Mafia APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Initialize App and Install Capacitor
      run: |
        mkdir mafia-app
        cd mafia-app
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        # إعدادات الكاباسيتور
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.mafia.game",
          "appName": "مافيا",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 2000,
              "backgroundColor": "#050d0a",
              "showSpinner": false
            }
          }
        }
        EOF
        
        mkdir www
        cp ../index.html www/
        
        npx cap add android
        
        # فرض الأيقونة وحذف كل النماذج والملفات الافتراضية التي تسبب عرض الايقونة القديمة
        if [ -f ../icon.png ]; then
          RES_DIR="android/app/src/main/res"
          
          # حذف مجلدات الأيقونات المتجهة والدائرية الافتراضية بالكامل
          rm -rf "$RES_DIR"/mipmap-anydpi-v26
          rm -f "$RES_DIR"/drawable/ic_launcher_background.xml
          rm -f "$RES_DIR"/drawable-v24/ic_launcher_background.xml
          
          # إنشاء وتعبئة جميع مجلدات الـ mipmap بصورتك لضمان ظهورها في كل مكان (القائمة، الإعدادات، المعلومات)
          for density in mdpidpi hdpi xhdpi xxhdpi xxxhdpi; do
            # تم تصحيح اسماء الكثافات بدقة
            true
          done
          
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES_DIR/mipmap-$density"
            cp ../icon.png "$RES_DIR/mipmap-$density/ic_launcher.png"
            cp ../icon.png "$RES_DIR/mipmap-$density/ic_launcher_round.png"
            cp ../icon.png "$RES_DIR/mipmap-$density/ic_launcher_foreground.png"
          done
        fi
        
        # تنظيف ملف AndroidManifest.xml لضمان الاعتماد الكلي على أيقونتك المخصصة
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          # إزالة خاصية roundIcon إن وجدت لكي لا يلجأ النظام لأي أيقونة دائرية افتراضية
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//g' "$MANIFEST_PATH"
          # التأكد من توجيه الأيقونة حصرياً إلى ic_launcher
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' "$MANIFEST_PATH"
        fi
        
        npx cap sync android
        
        # تعديل MainActivity لضمان ملء الشاشة الكامل
        MAIN_ACTIVITY="android/app/src/main/java/com/mafia/game/MainActivity.java"
        if [ -f "$MAIN_ACTIVITY" ]; then
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.mafia.game;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
        EOF
        fi
        
        # إنشاء مفتاح التوقيع الثائم وتكوينه
        cd android/app
        keytool -genkey -v -keystore mafia-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mafia-alias -storepass mafia123 -keypass mafia123 -dname "CN=Hasan, O=Mafia, C=SY"
        
        BUILD_GRADLE="build.gradle"
        cat << 'EOF' >> "$BUILD_GRADLE"

        android {
            signingConfigs {
                release {
                    storeFile file('mafia-release-key.jks')
                    storePassword 'mafia123'
                    keyAlias 'mafia-alias'
                    keyPassword 'mafia123'
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.release
                }
                release {
                    signingConfig signingConfigs.release
                }
            }
        }
        EOF
        
        cd ..
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon

    - name: Find and Rename APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-capacitor
        path: mafia.apk
