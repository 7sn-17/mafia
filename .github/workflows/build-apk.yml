name: Build Mafia APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Initialize App and Install Capacitor
      run: |
        mkdir mafia-app
        cd mafia-app
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        
        # إنشاء إعدادات Capacitor الأساسية
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        # إنشاء مجلد الويب ونسخ ملفاتك والأيقونة إليه
        mkdir www
        cp ../index.html www/
        if [ -f ../icon.png ]; then
          cp ../icon.png www/icon.png
        fi
        
        # إضافة منصة الأندرويد
        npx cap add android
        
        # مزامنة الملفات
        npx cap sync android
        
        # الانتقال لمجلد الأندرويد وبناء ملف الـ APK
        cd android
        ./gradlew assembleDebug

    - name: Find and Rename APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-capacitor
        path: mafia.apk
