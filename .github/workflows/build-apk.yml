name: Build and Sign Mafia Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # لتشغيل البناء يدوياً متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Licenses
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea3c55b4f0352627561932bc5" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $ANDROID_HOME/licenses/android-sdk-license

    - name: Install Exact Gradle 8.2
      run: |
        wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip gradle-8.2-bin.zip
        sudo rm -rf /opt/gradle
        sudo mv gradle-8.2 /opt/gradle
        sudo rm -f /usr/bin/gradle
        sudo ln -s /opt/gradle/bin/gradle /usr/bin/gradle

    - name: Build Release APK
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    # 2. توقيع ملف الـ APK والتحقق من صحة التوقيع بالكامل
    - name: Sign APK and Verify Signature
      run: |
        # تثبيت أدوات أندرويد المطلوبة للتوقيع والتحقق
        echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
        
        # فك تشفير مفتاح التوقيع من الأسرار
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
        
        # البحث عن ملف الـ APK الناتج وتخزين مساره في متغير
        APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Found APK to sign: $APK_FILE"
        
        # توقيع الملف الفعلي باستخدام مفتاحك الخاص والأسرار
        /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign \
          --ks release.jks \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          "$APK_FILE"

        # التحقق من التوقيع وطباعة تفاصيل الشهادة ومطابقتها في السجلات
        echo "=== فحص وتأكيد التوقيع الرقمي ==="
        /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK_FILE"
          
        # نسخ الملف بعد توقيعه وتسميته نهائياً
        cp "$APK_FILE" Mafia.apk

    # 5. حفظ نسخة كـ Artifact (للاحتياط)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mafia-Signed-APK
        path: Mafia.apk
