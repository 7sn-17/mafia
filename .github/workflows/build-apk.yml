name: Build Mafia APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create App and Build APK
      run: |
        cordova create my-app com.mafia.game "مافيا"
        cd my-app
        
        # نسخ ملفات اللعبة والأيقونة
        cp -r ../index.html www/
        if [ -f ../icon.png ]; then
          cp ../icon.png icon.png
        fi
        
        # إضافة إعدادات config.xml لتعطيل أي شاشة بداية افتراضية وضبط الأيقونة
        cat << 'EOF' > update_config.js
        const fs = require('fs');
        let config = fs.readFileSync('config.xml', 'utf8');
        
        // ربط الأيقونة
        config = config.replace('</widget>', '<icon src="icon.png" /></widget>');
        
        // تعطيل شاشة البداية بالكامل
        const splashFix = `
            <preference name="SplashScreen" value="none" />
            <preference name="SplashScreenDelay" value="0" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="false" />
        </widget>`;
        config = config.replace('</widget>', splashFix);
        
        fs.writeFileSync('config.xml', config, 'utf8');
        EOF
        
        node update_config.js
        
        cordova platform add android
        
        # حذف إضافة السبلاش سكرين نهائياً من منصة أندرويد لضمان عدم ظهور الشاشة الرمادية
        rm -rf platforms/android/app/src/main/res/drawable*splash* || true
        rm -rf plugins/cordova-plugin-splashscreen || true
        
        # بناء التطبيق
        cordova build android --debug

    - name: Find and Rename APK
      run: |
        find my-app/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia
        path: mafia.apk
