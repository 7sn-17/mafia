name: Build Mafia APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Initialize App and Install Capacitor
      run: |
        mkdir mafia-app
        cd mafia-app
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.mafia.game",
          "appName": "مافيا",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 2000,
              "backgroundColor": "#050d0a",
              "showSpinner": false
            }
          }
        }
        EOF
        
        mkdir www
        cp ../index.html www/
        
        npx cap add android
        
        # تنفيذ الـ sync أولاً
        npx cap sync android
        
        # --- الحقن اليدوي المباشر للأيقونة من المكانين لضمان نجاحها 100% ---
        TARGET_ICON=""
        if [ -f ../icon.png ]; then
          TARGET_ICON="../icon.png"
        elif [ -f ../assets/icon.png ]; then
          TARGET_ICON="../assets/icon.png"
        fi
        
        if [ -n "$TARGET_ICON" ]; then
          RES_DIR="android/app/src/main/res"
          
          # حذف مجلد أيقونات كاباسيتور الزرقاء التكيفية لمنع التداخل
          rm -rf "$RES_DIR"/mipmap-anydpi-v26
          
          # نسخ صورتك لجميع مقاسات الميبماپ
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            MIP_DIR="$RES_DIR/mipmap-$density"
            mkdir -p "$MIP_DIR"
            cp "$TARGET_ICON" "$MIP_DIR/ic_launcher.png"
            cp "$TARGET_ICON" "$MIP_DIR/ic_launcher_round.png"
            cp "$TARGET_ICON" "$MIP_DIR/ic_launcher_foreground.png"
          done
          
          # إنشاء مجلد anydpi يدويًا برمجياً ليتطابق مع صورتك تماماً
          ANY_DIR="$RES_DIR/mipmap-anydpi-v26"
          mkdir -p "$ANY_DIR"
          cat << 'EOF' > "$ANY_DIR/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_foreground"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat << 'EOF' > "$ANY_DIR/ic_launcher_round.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_foreground"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
        fi
        
        # تعديل الـ AndroidManifest لربط الأيقونات بشكل صحيح
        python3 -c '
import re
path = "android/app/src/main/AndroidManifest.xml"
with open(path, "r", encoding="utf-8") as f:
    content = f.read()

content = re.sub(r"android:roundIcon=\"@[^\"]+\"", "android:roundIcon=\"@mipmap/ic_launcher_round\"", content)
content = re.sub(r"android:icon=\"@[^\"]+\"", "android:icon=\"@mipmap/ic_launcher\"", content)

with open(path, "w", encoding="utf-8") as f:
    f.write(content)
'

        # تعديل MainActivity لملء الشاشة بالكامل
        MAIN_ACTIVITY="android/app/src/main/java/com/mafia/game/MainActivity.java"
        if [ -f "$MAIN_ACTIVITY" ]; then
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.mafia.game;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
        EOF
        fi
        
        # إعداد مفتاح التوقيع الثابت والدائم لتحديثات سلسة بدون مشاكل تعارض
        cd android/app
        keytool -genkey -v -keystore mafia-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mafia-alias -storepass mafia123 -keypass mafia123 -dname "CN=Hasan, O=Mafia, C=SY"
        
        BUILD_GRADLE="build.gradle"
        cat << 'EOF' >> "$BUILD_GRADLE"

        android {
            signingConfigs {
                release {
                    storeFile file('mafia-release-key.jks')
                    storePassword 'mafia123'
                    keyAlias 'mafia-alias'
                    keyPassword 'mafia123'
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.release
                }
                release {
                    signingConfig signingConfigs.release
                }
            }
        }
        EOF
        
        cd ..
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon

    - name: Find and Rename APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-capacitor
        path: mafia.apk
