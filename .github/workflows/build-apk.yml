name: Build Mafia APK with Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Initialize App and Install Capacitor
      run: |
        mkdir mafia-app
        cd mafia-app
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
        npm install -g cordova-res
        
        npx cap init "مافيا" "com.mafia.game" --web-dir www
        
        # إعدادات الكاباسيتور
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.mafia.game",
          "appName": "مافيا",
          "webDir": "www",
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 2000,
              "backgroundColor": "#050d0a",
              "showSpinner": false
            }
          }
        }
        EOF
        
        mkdir www
        cp ../index.html www/
        
        # نسخ الأيقونة الأصلية إلى الجذر لتتعرف عليها أداة توليد الأيقونات
        if [ -f ../icon.png ]; then
          cp ../icon.png icon.png
          cp ../icon.png www/icon.png
        fi
        
        npx cap add android
        
        # توليد الأيقونات الحقيقية ووضعها في مسارات أندرويد الصحيحة (mipmap) بالاعتماد على icon.png
        if [ -f icon.png ]; then
          cordova-res android --skip-config --icon-source=icon.png
        fi
        
        npx cap sync android
        
        # تعديل MainActivity لضمان ملء الشاشة الكامل
        MAIN_ACTIVITY="android/app/src/main/java/com/mafia/game/MainActivity.java"
        if [ -f "$MAIN_ACTIVITY" ]; then
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.mafia.game;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
        EOF
        fi
        
        # بناء الـ APK
        cd android
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon

    - name: Find and Rename APK
      run: |
        find mafia-app/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} mafia.apk \;
        ls -la mafia.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mafia-capacitor
        path: mafia.apk
