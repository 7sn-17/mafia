<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة مافيا - الموقع الرسمي للتحميل</title>
    <!-- استيراد خط Cairo العربي الراقي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- استيراد مكتبة أيقونات Font Awesome الاحترافية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استيراد مكتبة Particles.js لخلفية الجزيئات المتحركة الاحترافية -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #050e0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية الجزيئات */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            background: rgba(11, 29, 21, 0.75);
            border: 1px solid rgba(46, 204, 113, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(46, 204, 113, 0.1);
        }
        /* أيقونة أو شعار التطبيق من المستودع */
        .app-icon-box {
            width: 105px;
            height: 105px;
            background: #0b1d15;
            border: 2px solid #2ecc71;
            border-radius: 26px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
        }
        .app-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            color: #2ecc71;
            font-size: 2.4rem;
            margin-bottom: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(46, 204, 113, 0.3);
        }
        .subtitle {
            color: #cbd5e1;
            font-size: 1.05rem;
            margin-bottom: 30px;
            font-weight: 400;
            line-height: 1.6;
        }
        /* بطاقات الإحصائيات الفخمة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 15px 8px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(46, 204, 113, 0.4);
            transform: translateY(-2px);
        }
        .stat-number {
            color: #2ecc71;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
        }
        /* زر التحميل الرئيسي */
        .download-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: #050e0a;
            padding: 16px 25px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.35);
            transition: all 0.3s ease;
            margin-bottom: 22px;
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.55);
            background: linear-gradient(135deg, #34db80 0%, #2ecc71 100%);
        }
        /* أزرار التواصل الاجتماعي */
        .social-box {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .social-btn.whatsapp:hover { 
            background: #25d366; 
            color: #fff; 
            border-color: #25d366; 
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
        .social-btn.instagram:hover { 
            background: #e1306c; 
            color: #fff; 
            border-color: #e1306c; 
            box-shadow: 0 5px 15px rgba(225, 48, 108, 0.3);
        }
        
        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }
        footer span { color: #2ecc71; }
    </style>
</head>
<body>

    <!-- خلفية الجزيئات التفاعلية -->
    <div id="particles-js"></div>

    <div class="container">
        <!-- جلب صورة الأيقونة مباشرة من مسارها الحقيقي في مستودع GitHub الخاص بك -->
        <div class="app-icon-box">
            <img src="https://raw.githubusercontent.com/7sn-17/mafia/main/app/src/main/res/mipmap/ic_launcher.png" alt="Mafia Icon">
        </div>
        
        <h1>لعبة مافيا</h1>
        <p class="subtitle">تجربة الغموض والذكاء الجماعية الأقوى مع أصدقائك. حمل النسخة الرسمية الآن واستمتع باللعب!</p>

        <!-- قسم الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">v1.2</div>
                <div class="stat-label">الإصدار</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">5.2 MB</div>
                <div class="stat-label">الحجم</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">آمن 100%</div>
                <div class="stat-label">المانح</div>
            </div>
        </div>

        <!-- رابط التحميل المباشر الصحيح الذي يبدأ التنزيل تلقائياً -->
        <a href="https://github.com/7sn-17/mafia/releases/latest/download/Mafia.apk" class="download-btn">
            <i class="fa-solid fa-cloud-arrow-down"></i> تحميل التطبيق (APK)
        </a>

        <!-- أزرار التواصل الاجتماعي الاحترافية -->
        <div class="social-box">
            <a href="https://wa.me/17862927607" target="_blank" class="social-btn whatsapp">
                <i class="fa-brands fa-whatsapp fa-lg"></i> واتساب
            </a>
            <a href="https://www.instagram.com/7sn__08" target="_blank" class="social-btn instagram">
                <i class="fa-brands fa-instagram fa-lg"></i> إنستغرام
            </a>
        </div>
    </div>

    <footer>
        تم تطوير اللعبة بواسطة <span>حسن المحمد</span> © 2026
    </footer>

    <!-- إعدادات تأثيرات الجزيئات المتحركة (Particles) -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#2ecc71" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#2ecc71",
                    "opacity": 0.15,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.5,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "type": "grab" },
                    "onclick": { "enable": true, "type": "push" }
                },
                "modes": {
                    "grab": { "distance": 140, "line_linked": { "opacity": 0.4 } },
                    "push": { "particles_nb": 3 }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
