<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة مافيا - الموقع الرسمي للتحميل</title>
    <!-- خط Cairo العربي الراقي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- خلفية الجزيئات المتحركة -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #040907;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* خلفية الجزيئات الهادئة والاحترافية */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }
        /* الحاوية الكبرى بملء الشاشة وبدون حدود مزعجة */
        .wrapper {
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            gap: 24px;
        }
        /* أيقونة التطبيق بتصميم عصري فخم */
        .app-icon-container {
            width: 95px;
            height: 95px;
            background: #0b1a13;
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .app-icon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* عنوان اللعبة */
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-align: center;
        }
        h1 span {
            color: #2ecc71;
        }
        /* وصف اللعبة الأنيق المريح للعين */
        .description-card {
            background: rgba(11, 26, 19, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 18px 20px;
            border-radius: 18px;
            color: #cbd5e1;
            font-size: 0.98rem;
            line-height: 1.7;
            text-align: center;
            width: 100%;
        }
        .description-card strong {
            color: #2ecc71;
            display: inline-block;
            margin-bottom: 5px;
        }
        /* بطاقات الإحصائيات الاحترافية المتناسقة */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }
        .stat-box {
            background: rgba(11, 26, 19, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 10px;
            border-radius: 14px;
            text-align: center;
        }
        .stat-value {
            color: #2ecc71;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .stat-title {
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
        }
        /* زر التحميل البارز والاحترافي */
        .download-action-btn {
            background: #2ecc71;
            color: #040907;
            width: 100%;
            padding: 16px;
            font-size: 1.15rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.25);
            transition: all 0.2s ease;
        }
        .download-action-btn:active {
            transform: scale(0.98);
        }
        /* أزرار التواصل الاجتماعي */
        .social-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .social-link-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ffffff;
            padding: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .social-link-btn.wa:hover { background: #25d366; border-color: #25d366; }
        .social-link-btn.ig:hover { background: #e1306c; border-color: #e1306c; }
        
        /* الحقوق في الأسفل */
        footer {
            margin-top: 20px;
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
            position: relative;
            z-index: 2;
            font-weight: 600;
        }
        footer span { color: #2ecc71; }
    </style>
</head>
<body>

    <!-- خلفية الجزيئات -->
    <div id="particles-js"></div>

    <div class="wrapper">
        <!-- أيقونة التطبيق الحقيقية من GitHub -->
        <div class="app-icon-container">
            <img src="https://raw.githubusercontent.com/7sn-17/mafia/main/app/src/main/res/mipmap/ic_launcher.png" alt="Mafia App Icon">
        </div>
        
        <h1>لعبة <span>مافيا</span></h1>
        
        <!-- وصف اللعبة المرتب -->
        <div class="description-card">
            <strong>عُشاق الغموض والذكاء والكذب المتقن!</strong> 🕵️‍♂️🔥<br>
            اجمع أصدقاءك، اخلط الأوراق، وابدأ معركة التخطيط وكشف الخونة. تجربة جماعية تفاعلية ممتعة وبدون إعلانات.
        </div>

        <!-- الإحصائيات -->
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-value">v1.2</div>
                <div class="stat-title">الإصدار</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">210 KB</div>
                <div class="stat-title">الحجم</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">آمن</div>
                <div class="stat-title">الحماية</div>
            </div>
        </div>

        <!-- زر التحميل المباشر -->
        <a href="https://github.com/7sn-17/mafia/releases/latest/download/Mafia.apk" class="download-action-btn">
            <i class="fa-solid fa-cloud-arrow-down"></i> تحميل النسخة الرسمية (APK)
        </a>

        <!-- أزرار التواصل -->
        <div class="social-row">
            <a href="https://wa.me/17862927607" target="_blank" class="social-link-btn wa">
                <i class="fa-brands fa-whatsapp fa-lg"></i> واتساب
            </a>
            <a href="https://www.instagram.com/7sn__08" target="_blank" class="social-link-btn ig">
                <i class="fa-brands fa-instagram fa-lg"></i> إنستغرام
            </a>
        </div>
    </div>

    <footer>
        تم تطوير اللعبة بواسطة <span>حسن المحمد</span> © 2026
    </footer>

    <!-- برمجة الجزيئات الهادئة -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 35, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#2ecc71" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.2, "random": true },
                "size": { "value": 2.5, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 160,
                    "color": "#2ecc71",
                    "opacity": 0.1,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out"
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": false }, "onclick": { "enable": false } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
